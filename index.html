<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Users — IT4409</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --success: #10b981;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text2: #64748b;
      --radius: 10px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Header */
    header { background: var(--primary); color: #fff; padding: 16px 32px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(79,70,229,.3); }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    header span { font-size: 13px; opacity: .75; background: rgba(255,255,255,.15); padding: 3px 10px; border-radius: 20px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-left: auto; box-shadow: 0 0 0 3px rgba(34,197,94,.3); }
    .status-label { font-size: 12px; opacity: .8; }

    main { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border-radius: var(--radius); padding: 18px 20px; border: 1px solid var(--border); }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--primary); }
    .stat-card .label { font-size: 13px; color: var(--text2); margin-top: 2px; }

    /* Form card */
    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
    .card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; background: #fafafa; }
    .card-header .icon { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center; }
    .card-body { padding: 20px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr 120px auto auto; gap: 10px; align-items: end; }
    label.field { display: flex; flex-direction: column; gap: 5px; }
    label.field span { font-size: 12px; font-weight: 500; color: var(--text2); }
    input[type="text"], input[type="email"], input[type="number"] {
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit; color: var(--text); width: 100%;
      transition: border-color .15s, box-shadow .15s; outline: none;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }

    .checkbox-field { display: flex; align-items: center; gap: 7px; font-size: 14px; padding-bottom: 9px; }
    .checkbox-field input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

    button { padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit; transition: background .15s, transform .1s; display: inline-flex; align-items: center; gap: 6px; }
    button:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-warning { background: var(--warning); color: #fff; font-size: 13px; padding: 6px 12px; }
    .btn-warning:hover { background: var(--warning-hover); }
    .btn-danger { background: var(--danger); color: #fff; font-size: 13px; padding: 6px 12px; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }

    /* Toast */
    #toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 999; opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; max-width: 320px; }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.ok  { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    #toast.err { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th { padding: 11px 16px; text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); background: #f8fafc; border-bottom: 1px solid var(--border); }
    tbody td { padding: 13px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-admin { background: #ede9fe; color: #6d28d9; }
    .badge-user  { background: #f1f5f9; color: var(--text2); }

    .actions { display: flex; gap: 6px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-right: 8px; }

    .empty { text-align: center; padding: 48px 20px; color: var(--text2); }
    .empty svg { margin-bottom: 12px; opacity: .3; }
    .empty p { font-size: 15px; }

    .loading { text-align: center; padding: 32px; color: var(--text2); font-size: 14px; }

    #edit-section { display: none; border-top: 3px solid var(--warning); }
    #edit-section .card-header { background: #fffbeb; }
  </style>
</head>
<body>

<header>
  <div class="icon" style="width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;">
    <svg width="20" height="20" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
  </div>
  <h1>Quản lý Users</h1>
  <span>IT4409 — MSSV 20235032</span>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-label" id="status-label">Đang kết nối...</span>
  </div>
</header>

<main>
  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="value" id="stat-total">—</div>
      <div class="label">Tổng số users</div>
    </div>
    <div class="stat-card">
      <div class="value" id="stat-admin">—</div>
      <div class="label">Admin</div>
    </div>
    <div class="stat-card">
      <div class="value" id="stat-user">—</div>
      <div class="label">User thường</div>
    </div>
  </div>

  <!-- Add form -->
  <div class="card">
    <div class="card-header">
      <div class="icon">
        <svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      Thêm user mới
    </div>
    <div class="card-body">
      <div class="form-grid">
        <label class="field">
          <span>Họ tên *</span>
          <input type="text" id="new-name" placeholder="Nguyễn Văn A" />
        </label>
        <label class="field">
          <span>Email *</span>
          <input type="email" id="new-email" placeholder="example@email.com" />
        </label>
        <label class="field">
          <span>Tuổi</span>
          <input type="number" id="new-age" placeholder="20" min="0" />
        </label>
        <div class="checkbox-field">
          <input type="checkbox" id="new-admin" />
          <span>Admin</span>
        </div>
        <button class="btn-primary" onclick="createUser()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Thêm
        </button>
      </div>
    </div>
  </div>

  <!-- Edit form -->
  <div class="card" id="edit-section">
    <div class="card-header">
      <div class="icon" style="background:var(--warning)">
        <svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </div>
      Chỉnh sửa user
    </div>
    <div class="card-body">
      <div class="form-grid">
        <label class="field">
          <span>Họ tên *</span>
          <input type="text" id="edit-name" />
        </label>
        <label class="field">
          <span>Email *</span>
          <input type="email" id="edit-email" />
        </label>
        <label class="field">
          <span>Tuổi</span>
          <input type="number" id="edit-age" min="0" />
        </label>
        <div class="checkbox-field">
          <input type="checkbox" id="edit-admin" />
          <span>Admin</span>
        </div>
        <div style="display:flex;gap:8px;padding-bottom:9px">
          <button class="btn-primary" onclick="saveEdit()">Lưu</button>
          <button class="btn-secondary" onclick="cancelEdit()">Hủy</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="card-header">
      <div class="icon">
        <svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      </div>
      Danh sách users
      <span style="margin-left:auto;font-size:12px;font-weight:400;color:var(--text2)" id="table-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Tuổi</th>
            <th>Role</th>
            <th>Ngày tạo</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="user-table">
          <tr><td colspan="7" class="loading">Đang tải dữ liệu...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
  const API = 'https://it4409-cicd-demo-1.onrender.com/api/users';
  let editingId = null;

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show ' + type;
    clearTimeout(t._t);
    t._t = setTimeout(() => t.className = '', 3000);
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' });
  }

  function getInitials(name) {
    return (name || '?').split(' ').map(w => w[0]).slice(-2).join('').toUpperCase();
  }

  async function loadUsers() {
    try {
      const res = await fetch(API);
      const { data } = await res.json();

      document.getElementById('stat-total').textContent = data.length;
      document.getElementById('stat-admin').textContent = data.filter(u => u.isAdmin).length;
      document.getElementById('stat-user').textContent = data.filter(u => !u.isAdmin).length;
      document.getElementById('table-count').textContent = data.length + ' users';
      document.getElementById('status-dot').style.background = '#22c55e';
      document.getElementById('status-label').textContent = 'Backend online';

      const tbody = document.getElementById('user-table');
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          <p>Chưa có user nào</p></td></tr>`;
        return;
      }

      tbody.innerHTML = data.map((u, i) => `
        <tr>
          <td style="color:var(--text2);font-size:13px">${i + 1}</td>
          <td>
            <div style="display:flex;align-items:center">
              <div class="avatar">${getInitials(u.name)}</div>
              <span style="font-weight:500">${u.name}</span>
            </div>
          </td>
          <td style="color:var(--text2)">${u.email}</td>
          <td>${u.age ?? '—'}</td>
          <td><span class="badge ${u.isAdmin ? 'badge-admin' : 'badge-user'}">${u.isAdmin ? '⭐ Admin' : '👤 User'}</span></td>
          <td style="color:var(--text2);font-size:13px">${formatDate(u.createdAt)}</td>
          <td>
            <div class="actions">
              <button class="btn-warning" onclick="startEdit('${u._id}','${u.name}','${u.email}',${u.age ?? 'null'},${u.isAdmin})">✏️ Sửa</button>
              <button class="btn-danger"  onclick="deleteUser('${u._id}','${u.name}')">🗑️ Xóa</button>
            </div>
          </td>
        </tr>`).join('');
    } catch(e) {
      document.getElementById('status-dot').style.background = '#ef4444';
      document.getElementById('status-label').textContent = 'Backend offline';
      document.getElementById('user-table').innerHTML = `<tr><td colspan="7" class="empty"><p style="color:#ef4444">Không kết nối được backend</p></td></tr>`;
    }
  }

  async function createUser() {
    const name  = document.getElementById('new-name').value.trim();
    const email = document.getElementById('new-email').value.trim();
    const age   = parseInt(document.getElementById('new-age').value);
    const isAdmin = document.getElementById('new-admin').checked;
    if (!name || !email) return showToast('Vui lòng nhập họ tên và email', 'err');
    const body = { name, email, isAdmin, ...(age ? { age } : {}) };
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (res.ok) {
      showToast('Thêm user thành công!', 'ok');
      document.getElementById('new-name').value = '';
      document.getElementById('new-email').value = '';
      document.getElementById('new-age').value = '';
      document.getElementById('new-admin').checked = false;
      loadUsers();
    } else {
      const err = await res.json();
      showToast('Lỗi: ' + err.message, 'err');
    }
  }

  function startEdit(id, name, email, age, isAdmin) {
    editingId = id;
    document.getElementById('edit-name').value  = name;
    document.getElementById('edit-email').value = email;
    document.getElementById('edit-age').value   = age === null ? '' : age;
    document.getElementById('edit-admin').checked = isAdmin;
    const sec = document.getElementById('edit-section');
    sec.style.display = '';
    sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('edit-section').style.display = 'none';
  }

  async function saveEdit() {
    const name  = document.getElementById('edit-name').value.trim();
    const email = document.getElementById('edit-email').value.trim();
    const age   = parseInt(document.getElementById('edit-age').value);
    const isAdmin = document.getElementById('edit-admin').checked;
    const body = { name, email, isAdmin, ...(age ? { age } : {}) };
    const res = await fetch(`${API}/${editingId}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (res.ok) {
      showToast('Cập nhật thành công!', 'ok');
      cancelEdit();
      loadUsers();
    } else {
      const err = await res.json();
      showToast('Lỗi: ' + err.message, 'err');
    }
  }

  async function deleteUser(id, name) {
    if (!confirm(`Xóa user "${name}"?`)) return;
    const res = await fetch(`${API}/${id}`, { method:'DELETE' });
    if (res.ok) {
      showToast('Đã xóa user!', 'ok');
      loadUsers();
    }
  }

  loadUsers();
</script>
</body>
</html>
